<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560">
  <defs>
    <linearGradient id="b" x1="0" x2="1"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#14b8a6"/></linearGradient>
    <filter id="s"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0f172a" flood-opacity=".13"/></filter>
  </defs>
  <rect width="1280" height="560" rx="40" fill="#f8fbff"/>
  <text x="72" y="82" font-size="34" font-weight="900" fill="#0f172a">热处理装炉智能体：从“订单消息”到“现场执行”的闭环</text>
  <text x="72" y="124" font-size="18" fill="#64748b">不是替代 ERP/MES，也不是直接控制炉子；它位于订单、总工经验和现场施工之间。</text>
  <g transform="translate(70 185)" filter="url(#s)">
    <g>
      <rect x="0" y="0" width="210" height="230" rx="26" fill="#fff"/>
      <circle cx="55" cy="58" r="26" fill="#dbeafe"/>
      <text x="55" y="68" text-anchor="middle" font-size="30" font-weight="900" fill="#2563eb">1</text>
      <text x="34" y="118" font-size="23" font-weight="900" fill="#0f172a">订单标准化</text>
      <text x="34" y="154" font-size="15" fill="#64748b">把飞书群消息</text>
      <text x="34" y="178" font-size="15" fill="#64748b">整理成生产任务</text>
    </g>
    <g transform="translate(250 0)">
      <rect x="0" y="0" width="210" height="230" rx="26" fill="#fff"/>
      <circle cx="55" cy="58" r="26" fill="#dcfce7"/>
      <text x="55" y="68" text-anchor="middle" font-size="30" font-weight="900" fill="#16a34a">2</text>
      <text x="34" y="118" font-size="23" font-weight="900" fill="#0f172a">经验显性化</text>
      <text x="34" y="154" font-size="15" fill="#64748b">AI 初稿</text>
      <text x="34" y="178" font-size="15" fill="#64748b">总工确认与微调</text>
    </g>
    <g transform="translate(500 0)">
      <rect x="0" y="0" width="210" height="230" rx="26" fill="#fff"/>
      <circle cx="55" cy="58" r="26" fill="#ffedd5"/>
      <text x="55" y="68" text-anchor="middle" font-size="30" font-weight="900" fill="#ea580c">3</text>
      <text x="34" y="118" font-size="23" font-weight="900" fill="#0f172a">现场少出错</text>
      <text x="34" y="154" font-size="15" fill="#64748b">图例、分层图</text>
      <text x="34" y="178" font-size="15" fill="#64748b">坐标清单、PDF</text>
    </g>
    <g transform="translate(750 0)">
      <rect x="0" y="0" width="210" height="230" rx="26" fill="#fff"/>
      <circle cx="55" cy="58" r="26" fill="#ede9fe"/>
      <text x="55" y="68" text-anchor="middle" font-size="30" font-weight="900" fill="#7c3aed">4</text>
      <text x="34" y="118" font-size="23" font-weight="900" fill="#0f172a">过程可追溯</text>
      <text x="34" y="154" font-size="15" fill="#64748b">方案记录、JSON</text>
      <text x="34" y="178" font-size="15" fill="#64748b">施工单与历史复用</text>
    </g>
  </g>
  <path d="M290 300 H320 M540 300 H570 M790 300 H820" stroke="url(#b)" stroke-width="8" stroke-linecap="round"/>
</svg>